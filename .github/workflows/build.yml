name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name Talk2Text \
            --collect-all customtkinter \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all pynput \
            --hidden-import huggingface_hub \
            --hidden-import tokenizers \
            --hidden-import sounddevice \
            --hidden-import scipy.io.wavfile \
            talk2text.py

      - uses: actions/upload-artifact@v4
        with:
          name: Talk2Text-Windows
          path: dist/Talk2Text.exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload ${{ github.ref_name }} dist/Talk2Text.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PortAudio
        run: brew install portaudio

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: |
          pyinstaller --onefile --windowed --name Talk2Text \
            --collect-all customtkinter \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all pynput \
            --hidden-import huggingface_hub \
            --hidden-import tokenizers \
            --hidden-import sounddevice \
            --hidden-import scipy.io.wavfile \
            talk2text.py

      - uses: actions/upload-artifact@v4
        with:
          name: Talk2Text-macOS
          path: dist/Talk2Text

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload ${{ github.ref_name }} dist/Talk2Text --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
