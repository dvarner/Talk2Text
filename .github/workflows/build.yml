name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; only the release job is granted write below.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name Talk2Text \
            --collect-all customtkinter \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all pynput \
            --hidden-import huggingface_hub \
            --hidden-import tokenizers \
            --hidden-import sounddevice \
            --hidden-import scipy.io.wavfile \
            talk2text.py

      - uses: actions/upload-artifact@v4
        with:
          name: Talk2Text-Windows
          path: dist/Talk2Text.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PortAudio
        run: brew install portaudio

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: |
          pyinstaller --onefile --windowed --name Talk2Text \
            --collect-all customtkinter \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all pynput \
            --hidden-import huggingface_hub \
            --hidden-import tokenizers \
            --hidden-import sounddevice \
            --hidden-import scipy.io.wavfile \
            talk2text.py

      - uses: actions/upload-artifact@v4
        with:
          name: Talk2Text-macOS
          path: dist/Talk2Text

  # Tag-only release: the single place that needs write access. Publishes the
  # binaries plus SHA-256 checksums so users can verify their downloads.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          sha256sum \
            Talk2Text-Windows/Talk2Text.exe \
            Talk2Text-macOS/Talk2Text > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            Talk2Text-Windows/Talk2Text.exe \
            Talk2Text-macOS/Talk2Text \
            SHA256SUMS.txt --clobber
