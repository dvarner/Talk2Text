name: Mobile

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Accept SDK licenses so Gradle can fetch the NDK whisper_ggml pins.
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: Talk2Text-Android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      # whisper_ggml pulls ffmpeg_kit, whose iOS framework is device-only (no
      # simulator slice), so a --simulator build can't link it. Compile for a
      # real device instead, with code signing disabled — validates the build
      # with no Apple account. Device signing / TestFlight come later.
      - run: flutter build ios --release --no-codesign --config-only
      - name: Build iOS (device, unsigned)
        working-directory: mobile/ios
        run: |
          pod install
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

