name: Sync labels

# Creates/updates the repo's labels to match .github/labels.yml whenever that
# file changes. Run it manually anytime from the Actions tab (workflow_dispatch).
on:
  push:
    branches: ["**"]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crazy-max/ghaction-github-labeler@v5
        with:
          yaml_file: .github/labels.yml
          # Never delete labels that aren't in the file (keeps GitHub defaults).
          skip_delete: true
          dry_run: false
