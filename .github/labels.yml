# Label definitions — synced to the repo by .github/workflows/labels.yml
# (edit this file, push, and the workflow recolors/creates labels to match).
#
# Status workflow (kanban-style):
#   open → in progress → review → done
#   paused / cancelled / duplicate as needed.
# "done", "cancelled" and "duplicate" pair with GitHub's native close reasons
# (completed / not planned / duplicate) when the issue is closed.

# ── Status ─────────────────────────────────────────────────────────────
- name: "status: open"
  color: "0e8a16"
  description: "Triaged and ready to be picked up"
- name: "status: in progress"
  color: "fbca04"
  description: "Actively being worked on"
- name: "status: review"
  color: "1d76db"
  description: "In review / awaiting feedback or PR review"
- name: "status: paused"
  color: "d93f0b"
  description: "Blocked or intentionally on hold"
- name: "status: done"
  color: "5319e7"
  description: "Completed — close as completed"
- name: "status: cancelled"
  color: "6a737d"
  description: "Won't do — close as not planned"
- name: "status: duplicate"
  color: "cfd3d7"
  description: "Duplicate of another issue — close as duplicate"

# ── Type ───────────────────────────────────────────────────────────────
- name: "type: feature"
  color: "a2eeef"
  description: "New capability"
- name: "type: enhancement"
  color: "bfdadc"
  description: "Improvement to an existing capability"
- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation"
- name: "type: chore"
  color: "ededed"
  description: "Build, CI, tooling, maintenance"

# ── Priority ───────────────────────────────────────────────────────────
- name: "priority: high"
  color: "b60205"
  description: "Do soon"
- name: "priority: medium"
  color: "fbca04"
  description: "Normal priority"
- name: "priority: low"
  color: "0e8a16"
  description: "Nice to have"

# ── Area ───────────────────────────────────────────────────────────────
- name: "area: android"
  color: "3ddc84"
  description: "Android app / build"
- name: "area: ios"
  color: "999999"
  description: "iOS app / build"
- name: "area: ci"
  color: "ededed"
  description: "CI / GitHub Actions"
- name: "area: transcription"
  color: "c5def5"
  description: "Whisper / speech-to-text engines"
- name: "area: docs"
  color: "0075ca"
  description: "README / documentation"
