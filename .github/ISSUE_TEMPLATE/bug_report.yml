name: Bug report
description: Something isn't working
title: "[Bug]: "
labels: ["type: bug", "status: open"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / OS version
      placeholder: "e.g. Pixel 7, Android 14"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
    validations:
      required: false
