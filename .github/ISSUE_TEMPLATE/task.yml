name: Task
description: A scoped piece of work — feature, enhancement, or chore
title: "[Task]: "
labels: ["status: open"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be done, and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we'll know it's done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - android
        - ios
        - ci
        - transcription
        - docs
        - other
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - high
        - medium
        - low
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes / context
    validations:
      required: false
